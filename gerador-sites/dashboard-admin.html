<!DOCTYPE html>
<!-- ============================================================
     ARQUIVO: dashboard-admin.html
     DESCRIÇÃO: Painel (dashboard) do Admin da plataforma.
     Gestão de clientes, planos (inclui o Vitalício - exclusivo
     do admin), receitas e status.
     ============================================================ -->
<html lang="pt-BR">
<head>
    <!-- Metadados básicos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página -->
    <title>Painel Admin — Gerador de Sites</title>
    <!-- Estilos globais -->
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* ======================================================
           ESTILOS DO DASHBOARD ADMIN
           ====================================================== */
        /* Cards de estatísticas */
        .stats {
            /* Cria a grade */
            display: grid;
            /* Colunas responsivas */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            /* Espaçamento */
            gap: 20px;
            /* Margem inferior */
            margin-bottom: 30px;
        }
        /* Card de estatística */
        .stat-card {
            /* Fundo */
            background: rgba(255, 255, 255, 0.05);
            /* Borda */
            border: 1px solid rgba(255, 255, 255, 0.1);
            /* Cantos */
            border-radius: var(--raio-borda);
            /* Padding */
            padding: 20px;
        }
        /* Valor da estatística */
        .stat-card .valor {
            /* Tamanho da fonte */
            font-size: 1.8em;
            /* Negrito */
            font-weight: 700;
            /* Cor */
            color: var(--cor-primaria);
        }
        /* Rótulo da estatística */
        .stat-card .rotulo {
            /* Cor */
            color: var(--cor-texto-cinza);
            /* Tamanho */
            font-size: 0.9em;
        }
        /* Título de seção */
        .secao-titulo {
            /* Cor */
            color: #f1f5f9;
            /* Margem inferior */
            margin: 25px 0 15px;
        }
        /* Tabela de clientes */
        .tabela {
            /* Largura total */
            width: 100%;
            /* Colapso de bordas */
            border-collapse: collapse;
            /* Fundo */
            background: rgba(255, 255, 255, 0.05);
            /* Borda */
            border: 1px solid rgba(255, 255, 255, 0.1);
            /* Cantos */
            border-radius: var(--raio-borda);
            /* Esconde o excesso */
            overflow: hidden;
        }
        /* Cabeçalho da tabela */
        .tabela th {
            /* Alinhamento à esquerda */
            text-align: left;
            /* Padding */
            padding: 12px;
            /* Fundo */
            background: rgba(255, 255, 255, 0.08);
            /* Cor */
            color: var(--cor-primaria);
            /* Tamanho */
            font-size: 0.85em;
        }
        /* Células da tabela */
        .tabela td {
            /* Padding */
            padding: 12px;
            /* Borda inferior */
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            /* Tamanho */
            font-size: 0.9em;
        }
        /* Última linha sem borda */
        .tabela tr:last-child td {
            /* Remove borda */
            border-bottom: none;
        }
        /* Selo de plano */
        .plano-badge {
            /* Padding */
            padding: 3px 10px;
            /* Cantos */
            border-radius: 12px;
            /* Tamanho */
            font-size: 0.75em;
        }
        /* Cores dos planos */
        .plano-free { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .plano-basic { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .plano-pro { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .plano-vitalicio { background: rgba(245, 158, 11, 0.25); color: #fbbf24; }
        /* Ações da tabela */
        .acoes-admin {
            /* Organiza os botões */
            display: flex;
            /* Espaçamento */
            gap: 6px;
        }
        /* Botão muito pequeno */
        .btn-mini {
            /* Padding */
            padding: 6px 10px;
            /* Fonte */
            font-size: 0.78em;
        }
    </style>
</head>
<body>
    <!-- Container central -->
    <div class="container">
        <!-- Barra de navegação -->
        <nav class="navbar">
            <!-- Logo -->
            <a href="index.html" class="logo">🚀 Gerador de Sites — Admin</a>
            <!-- Links -->
            <div class="nav-links">
                <a href="#" onclick="sair(); return false;">Sair</a>
            </div>
        </nav>

        <!-- Área dinâmica do dashboard admin -->
        <div id="areaAdmin">
            <!-- Conteúdo carregado via JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
// ======================================================
        // LÓGICA DO DASHBOARD ADMIN
        // ======================================================

// Protege a página (exige login)
        protegerPagina('login.html');

        // Verifica se o usuário logado é admin (segurança - DECISÃO)
        // O painel do admin é exclusivo para administradores.
        // Qualquer cliente comum não pode acessar (protege o plano
        // Vitalício, que é concedido apenas pelo admin).
        if (!ehAdmin()) {
            // Mostra um aviso de acesso negado e redireciona
            mostrarToast('Acesso restrito: apenas administradores podem entrar aqui', 'erro');
            // Redireciona para o dashboard comum do cliente
            irPara('dashboard.html');
        }

        // Elemento da área do admin
        const area = document.getElementById('areaAdmin');

        // Define o plano padrão exibido
        function planoBadge(plano) {
            // Mapeia o plano para uma classe CSS
            const classes = { free: 'plano-free', basic: 'plano-basic', pro: 'plano-pro', vitalicio: 'plano-vitalicio' };
            // Retorna o selo do plano
            return `<span class="plano-badge ${classes[plano] || 'plano-free'}">${plano || 'free'}</span>`;
        }

        // Formata um valor em reais
        function formatarReal(valor) {
            // Converte para número e usa toLocaleString
            return (Number(valor) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Carrega os dados do admin (clientes + receita)
        async function carregarAdmin() {
            // Busca todos os clientes da API real
            const respClientes = await apiListarClientesAdmin();
            // Se falhou, mostra erro
            if (!respClientes.sucesso) {
                // Mostra a mensagem de erro
                area.innerHTML = `<div class="vazio"><p>Erro ao carregar clientes: ${respClientes.mensagem}</p></div>`;
                return;
            }
            // Obtém a lista de clientes
            const clientes = respClientes.dados || [];

            // Busca todas as transações financeiras
            const respTransacoes = await apiListarTransacoes('');
            // Obtém as transações (se houver)
            const transacoes = respTransacoes.sucesso ? (respTransacoes.dados || []) : [];

            // Calcula a receita do mês (transações pagas do tipo mensalidade)
            const agora = new Date();
            const mesAtual = agora.getMonth();
            const anoAtual = agora.getFullYear();
            // Filtra as mensalidades pagas do mês atual
            const receitaMes = transacoes
                .filter(t => t.TIPO === 'mensalidade' && t.STATUS_PAGAMENTO === 'pago')
                .reduce((soma, t) => soma + (Number(t.VALOR) || 0), 0);

            // Monta estatísticas
            const ativos = clientes.filter(c => c.STATUS === 'ativo').length;
            const inadimplentes = clientes.filter(c => c.STATUS === 'inadimplente').length;

            // Monta o HTML do dashboard admin
            area.innerHTML = `
                <div class="saudacao" style="margin-bottom:25px;">
                    <h2 style="color:var(--cor-primaria);">Painel do Administrador</h2>
                    <p style="color:var(--cor-texto-cinza);">Gestão completa de clientes, planos, financeiro e vendas</p>
                </div>

                <!-- Cards de estatísticas -->
                <div class="stats">
                    <div class="stat-card"><div class="valor">${clientes.length}</div><div class="rotulo">Clientes</div></div>
                    <div class="stat-card"><div class="valor">${ativos}</div><div class="rotulo">Ativos</div></div>
                    <div class="stat-card"><div class="valor">${inadimplentes}</div><div class="rotulo">Inadimplentes</div></div>
                    <div class="stat-card"><div class="valor">${formatarReal(receitaMes)}</div><div class="rotulo">Receita do mês</div></div>
                </div>

                <!-- Abas de navegação do admin -->
                <div class="painel-abas" style="margin:20px 0;">
                    <button class="ativo" id="abaClientesBtn" onclick="trocarAbaAdmin('clientes')">👥 Clientes</button>
                    <button id="abaFinanceiroBtn" onclick="trocarAbaAdmin('financeiro')">💰 Financeiro</button>
                    <button id="abaVendasBtn" onclick="trocarAbaAdmin('vendas')">🛒 Vendas</button>
                </div>
                <div id="conteudoAdmin"></div>

                <!-- Aviso sobre o plano vitalício -->
                <p style="color:var(--cor-texto-cinza); font-size:0.85em; margin-top:15px;">
                    ⚠️ <strong>Plano Vitalício</strong> é uma <strong>concessão exclusiva do admin</strong>. Ele não aparece nos planos oferecidos ao cliente.
                </p>
            `;

            // Guarda os dados carregados para as abas
            area._clientes = clientes;
            area._transacoes = transacoes;
            // Exibe a aba de clientes por padrão
            trocarAbaAdmin('clientes');
        }

        // Alterna entre as abas do admin
        function trocarAbaAdmin(aba) {
            // Atualiza os botões ativos
            document.getElementById('abaClientesBtn').classList.toggle('ativo', aba === 'clientes');
            document.getElementById('abaFinanceiroBtn').classList.toggle('ativo', aba === 'financeiro');
            document.getElementById('abaVendasBtn').classList.toggle('ativo', aba === 'vendas');
            // Conteúdo da aba selecionada
            const conteudo = document.getElementById('conteudoAdmin');
            // Se for a aba de clientes
            if (aba === 'clientes') {
                // Renderiza a tabela de clientes
                conteudo.innerHTML = renderTabelaClientes(area._clientes || []);
            } else if (aba === 'financeiro') {
                // Renderiza a tabela de financeiro
                renderFinanceiro(conteudo);
            } else {
                // Renderiza a tabela de vendas
                renderVendas(conteudo);
            }
        }

        // Monta a tabela de clientes
        function renderTabelaClientes(clientes) {
            // Monta o cabeçalho da tabela
            let html = `
                <h3 class="secao-titulo">Clientes da plataforma</h3>
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Plano</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            // Se não houver clientes
            if (clientes.length === 0) {
                // Mostra mensagem vazia
                html += `<tr><td colspan="5" style="text-align:center;color:var(--cor-texto-cinza);">Nenhum cliente cadastrado ainda.</td></tr>`;
            } else {
                // Percorre os clientes
                clientes.forEach(cliente => {
                    // Obtém nome e email (aceita mock ou real)
                    const nome = cliente.NOME_COMPLETO || cliente.nome || '—';
                    const email = cliente.EMAIL || cliente.email || '—';
                    const plano = cliente.PLANO || cliente.plano || 'free';
                    const status = cliente.STATUS || cliente.status || 'ativo';
                    // Define a cor do status
                    const corStatus = status === 'ativo' ? '#34d399' : status === 'inadimplente' ? '#f87171' : '#94a3b8';
                    // Obtém o id (aceita mock ou real)
                    const id = cliente.ID || cliente.id;
                    // Monta a linha do cliente
                    html += `
                        <tr>
                            <td>${nome}</td>
                            <td>${email}</td>
                            <td>${planoBadge(plano)}</td>
                            <td style="color:${corStatus};">${status}</td>
                            <td>
                                <div class="acoes-admin">
                                    <button class="btn btn-outline btn-mini" onclick="darVitalicio('${id}')">Vitalício</button>
                                    <button class="btn btn-outline btn-mini" onclick="marcarInadimplente('${id}')">Inadimplente</button>
                                    <button class="btn btn-outline btn-mini" onclick="ativar('${id}')">Ativar</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            }
            // Fecha a tabela
            html += '</tbody></table>';
            // Retorna o HTML
            return html;
        }

        // Renderiza a aba de financeiro
        async function renderFinanceiro(conteudo) {
            // Busca as transações da API
            const resp = await apiListarTransacoes('');
            // Obtém as transações
            const transacoes = resp.sucesso ? (resp.dados || []) : [];
            // Monta o HTML
            let html = `
                <h3 class="secao-titulo">Financeiro — Mensalidades</h3>
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Transação</th>
                            <th>Cliente</th>
                            <th>Plano</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Método</th>
                            <th>Vencimento</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            // Se não houver transações
            if (transacoes.length === 0) {
                // Mostra mensagem vazia
                html += `<tr><td colspan="7" style="text-align:center;color:var(--cor-texto-cinza);">Nenhuma transação registrada.</td></tr>`;
            } else {
                // Percorre as transações
                transacoes.forEach(t => {
                    // Define a cor do status
                    const cor = t.STATUS_PAGAMENTO === 'pago' ? '#34d399' : t.STATUS_PAGAMENTO === 'inadimplente' ? '#f87171' : '#fbbf24';
                    // Monta a linha da transação
                    html += `
                        <tr>
                            <td>${t.ID_TRANSACAO || t.idTransacao}</td>
                            <td>${t.ID_CLIENTE || t.idCliente}</td>
                            <td>${planoBadge(t.PLANO || t.plano)}</td>
                            <td>${formatarReal(t.VALOR || t.valor)}</td>
                            <td style="color:${cor};">${t.STATUS_PAGAMENTO || t.statusPagamento}</td>
                            <td>${t.METODO || t.metodo || 'Pix'}</td>
                            <td>${t.DATA_VENCIMENTO || t.dataVencimento || '—'}</td>
                        </tr>
                    `;
                });
            }
            // Fecha a tabela
            html += '</tbody></table>';
            // Insere no conteúdo
            conteudo.innerHTML = html;
        }

        // Renderiza a aba de vendas
        async function renderVendas(conteudo) {
            // Busca as vendas da API
            const resp = await apiListarVendas('');
            // Obtém as vendas
            const vendas = resp.sucesso ? (resp.dados || []) : [];
            // Monta o HTML
            let html = `
                <h3 class="secao-titulo">Vendas dos sites dos clientes</h3>
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Venda</th>
                            <th>Site</th>
                            <th>Dono</th>
                            <th>Produto/Serviço</th>
                            <th>Valor</th>
                            <th>Comprador</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            // Se não houver vendas
            if (vendas.length === 0) {
                // Mostra mensagem vazia
                html += `<tr><td colspan="7" style="text-align:center;color:var(--cor-texto-cinza);">Nenhuma venda registrada.</td></tr>`;
            } else {
                // Percorre as vendas
                vendas.forEach(v => {
                    // Define a cor do status
                    const cor = v.STATUS_PAGAMENTO === 'pago' ? '#34d399' : '#fbbf24';
                    // Monta a linha da venda
                    html += `
                        <tr>
                            <td>${v.ID_VENDA || v.idVenda}</td>
                            <td>${v.ID_SITE || v.idSite}</td>
                            <td>${v.ID_CLIENTE || v.idCliente}</td>
                            <td>${v.PRODUTO_SERVICO || v.produtoServico}</td>
                            <td>${formatarReal(v.VALOR || v.valor)}</td>
                            <td>${v.CLIENTE_FINAL || v.clienteFinal}</td>
                            <td style="color:${cor};">${v.STATUS_PAGAMENTO || v.statusPagamento}</td>
                        </tr>
                    `;
                });
            }
            // Fecha a tabela
            html += '</tbody></table>';
            // Insere no conteúdo
            conteudo.innerHTML = html;
        }

        // Concede o plano vitalício a um cliente (exclusivo do admin)
        async function darVitalicio(idCliente) {
            // Chama a API para atualizar plano admin (vitalicio)
            const resposta = await apiAtualizarPlanoAdmin(idCliente, 'vitalicio');
            // Se atualizou com sucesso
            if (resposta.sucesso) {
                // Informa o sucesso
                mostrarToast('Plano Vitalício concedido!', 'sucesso');
            } else {
                // Mostra o erro
                mostrarToast(resposta.mensagem, 'erro');
            }
            // Recarrega o dashboard
            carregarAdmin();
        }

        // Marca um cliente como inadimplente
        async function marcarInadimplente(idCliente) {
            // Chama a API para atualizar status
            const resposta = await apiAtualizarStatusCliente(idCliente, 'inadimplente');
            // Se atualizou com sucesso
            if (resposta.sucesso) {
                // Informa o sucesso
                mostrarToast('Cliente marcado como inadimplente', 'sucesso');
            } else {
                // Mostra o erro
                mostrarToast(resposta.mensagem, 'erro');
            }
            // Recarrega o dashboard
            carregarAdmin();
        }

        // Ativa um cliente
        async function ativar(idCliente) {
            // Chama a API para atualizar status
            const resposta = await apiAtualizarStatusCliente(idCliente, 'ativo');
            // Se atualizou com sucesso
            if (resposta.sucesso) {
                // Informa o sucesso
                mostrarToast('Cliente ativado', 'sucesso');
            } else {
                // Mostra o erro
                mostrarToast(resposta.mensagem, 'erro');
            }
            // Recarrega o dashboard
            carregarAdmin();
        }

        // Carrega o dashboard admin ao iniciar
        carregarAdmin();
    </script>
</body>
</html>
