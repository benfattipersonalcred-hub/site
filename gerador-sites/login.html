<!DOCTYPE html>
<!-- ============================================================
     ARQUIVO: login.html
     DESCRIÇÃO: Página de login/cadastro da plataforma.
     Suporta Mock Mode (localStorage) e o modo real (Apps Script).
     ============================================================ -->
<html lang="pt-BR">
<head>
    <!-- Metadados básicos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título dinâmico -->
    <title>Entrar — Gerador de Sites</title>
    <!-- Estilos globais -->
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* ======================================================
           ESTILOS DA PÁGINA DE LOGIN
           ====================================================== */
        /* Container centralizador do formulário */
        .login-container {
            /* Limita a largura */
            max-width: 440px;
            /* Centraliza horizontalmente */
            margin: 40px auto;
            /* Fundo do card */
            background: rgba(255, 255, 255, 0.05);
            /* Borda sutil */
            border: 1px solid rgba(255, 255, 255, 0.1);
            /* Cantos arredondados */
            border-radius: var(--raio-borda);
            /* Espaçamento interno */
            padding: 35px;
        }
        /* Título do formulário */
        .login-container h2 {
            /* Centraliza */
            text-align: center;
            /* Margem inferior */
            margin-bottom: 5px;
            /* Cor */
            color: var(--cor-primaria);
        }
        /* Subtítulo */
        .login-container .sub {
            /* Centraliza */
            text-align: center;
            /* Cor cinza */
            color: var(--cor-texto-cinza);
            /* Tamanho */
            font-size: 0.9em;
            /* Margem inferior */
            margin-bottom: 25px;
        }
        /* Grupo de campo */
        .campo {
            /* Margem inferior */
            margin-bottom: 18px;
        }
        /* Seletor de modo (login/cadastro) */
        .modo-toggle {
            /* Organiza os botões */
            display: flex;
            /* Margem inferior */
            margin-bottom: 25px;
            /* Fundo */
            background: rgba(255, 255, 255, 0.05);
            /* Cantos */
            border-radius: 10px;
            /* Padding */
            padding: 4px;
        }
        /* Botão do modo */
        .modo-toggle button {
            /* Cresce para preencher */
            flex: 1;
            /* Fundo transparente */
            background: transparent;
            /* Borda transparente */
            border: none;
            /* Cor do texto */
            color: var(--cor-texto-cinza);
            /* Padding */
            padding: 10px;
            /* Cantos */
            border-radius: 8px;
            /* Cursor */
            cursor: pointer;
            /* Transição */
            transition: all 0.3s;
            /* Fonte */
            font-size: 0.95em;
            /* Negrito */
            font-weight: 600;
        }
        /* Botão ativo do modo */
        .modo-toggle button.ativo {
            /* Fundo gradiente */
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
            /* Texto branco */
            color: white;
        }
        /* Botão de login ocupando toda largura */
        .btn-login {
            /* Largura total */
            width: 100%;
            /* Margem superior */
            margin-top: 10px;
        }
        /* Link de alternância no rodapé */
        .alternar {
            /* Centraliza */
            text-align: center;
            /* Margem superior */
            margin-top: 15px;
            /* Tamanho */
            font-size: 0.9em;
            /* Cor */
            color: var(--cor-texto-cinza);
        }
        /* Link do alternar */
        .alternar a {
            /* Cor azul */
            color: var(--cor-primaria);
            /* Sem sublinhado */
            text-decoration: none;
        }
        /* Campos extras do cadastro (escondidos por padrão) */
        .campos-cadastro {
            /* Inicialmente escondido */
            display: none;
        }
        /* Mostra os campos quando a classe ativa */
        .campos-cadastro.visivel {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Container central -->
    <div class="container">
        <!-- Barra de navegação simplificada -->
        <nav class="navbar">
            <a href="index.html" class="logo">🚀 Gerador de Sites</a>
            <div class="nav-links">
                <a href="index.html">Início</a>
            </div>
        </nav>

        <!-- Container do formulário -->
        <div class="login-container">
            <!-- Título -->
            <h2 id="titulo">Bem-vindo de volta!</h2>
            <!-- Subtítulo -->
            <p class="sub" id="subtitulo">Entre com sua conta para continuar</p>

            <!-- Seletor de modo -->
            <div class="modo-toggle">
                <button id="btnLogin" class="ativo" onclick="definirModo('login')">Entrar</button>
                <button id="btnCadastro" onclick="definirModo('cadastro')">Criar Conta</button>
            </div>

            <!-- Formulário -->
            <form id="formAuth" onsubmit="event.preventDefault(); processarForm();">
                <!-- Campo nome (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoNome">
                    <label class="label" for="nome">Nome completo</label>
                    <input class="input" type="text" id="nome" placeholder="Seu nome completo">
                </div>

                <!-- Campo email -->
                <div class="campo">
                    <label class="label" for="email">E-mail</label>
                    <input class="input" type="email" id="email" placeholder="voce@email.com">
                </div>

<!-- Campo telefone (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoTel">
                    <label class="label" for="tel">WhatsApp</label>
                    <input class="input" type="tel" id="tel" placeholder="(00) 00000-0000">
                </div>

                <!-- Campo CPF (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoCpf">
                    <label class="label" for="cpf">CPF</label>
                    <input class="input" type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <!-- Campo data de nascimento (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoNasc">
                    <label class="label" for="nascimento">Data de nascimento</label>
                    <input class="input" type="date" id="nascimento">
                </div>

                <!-- Campo tipo de cliente (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoTipo">
                    <label class="label" for="tipoCliente">Tipo de cliente</label>
                    <select class="input" id="tipoCliente" onchange="alternarTipoCliente()">
                        <option value="PF">Pessoa Física (PF)</option>
                        <option value="PJ">Pessoa Jurídica (PJ)</option>
                    </select>
                </div>

                <!-- Campo CNPJ (apenas cadastro, se PJ) -->
                <div class="campo campos-cadastro" id="campoCnpj" style="display:none;">
                    <label class="label" for="cnpj">CNPJ</label>
                    <input class="input" type="text" id="cnpj" placeholder="00.000.000/0000-00">
                </div>

                <!-- Campo CEP (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoCep">
                    <label class="label" for="cep">CEP</label>
                    <input class="input" type="text" id="cep" placeholder="00000-000">
                </div>

                <!-- Campo endereço (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoEnd">
                    <label class="label" for="endereco">Endereço</label>
                    <input class="input" type="text" id="endereco" placeholder="Rua, avenida...">
                </div>

                <!-- Campo número (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoNum">
                    <label class="label" for="numero">Número</label>
                    <input class="input" type="text" id="numero" placeholder="123">
                </div>

                <!-- Campo bairro (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoBairro">
                    <label class="label" for="bairro">Bairro</label>
                    <input class="input" type="text" id="bairro" placeholder="Seu bairro">
                </div>

                <!-- Campo cidade (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoCidade">
                    <label class="label" for="cidade">Cidade</label>
                    <input class="input" type="text" id="cidade" placeholder="Sua cidade">
                </div>

<!-- Campo estado (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoEstado">
                    <label class="label" for="estado">Estado (UF)</label>
                    <input class="input" type="text" id="estado" placeholder="SP">
                </div>

                <!-- Campo plano (apenas cadastro) -->
                <div class="campo campos-cadastro" id="campoPlano">
                    <label class="label" for="plano">Plano</label>
                    <select class="input" id="plano" onchange="definirPlano(this.value)">
                        <option value="free">Free — R$ 0,00</option>
                        <option value="basic">Basic — R$ 29,90/mês</option>
                        <option value="pro">Pro — R$ 79,90/mês</option>
                    </select>
                </div>

                <!-- Campo senha -->
                <div class="campo">
                    <label class="label" for="senha">Senha</label>
                    <input class="input" type="password" id="senha" placeholder="Sua senha">
                </div>

                <!-- Botão de envio -->
                <button type="submit" class="btn btn-primary btn-login" id="btnSubmit">Entrar</button>
            </form>

            <!-- Link de alternância -->
            <p class="alternar" id="linkAlternar">
                Não tem conta? <a href="#" onclick="definirModo('cadastro'); return false;">Criar agora</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // ======================================================
        // LÓGICA DE LOGIN/CADASTRO
        // ======================================================

        // Define o modo atual (login ou cadastro)
        let modoAtual = 'login';

// Define o modo da página (login/cadastro)
        function definirModo(modo) {
            // Atualiza a variável do modo atual
            modoAtual = modo;
            // Pega os elementos do formulário
            const btnLogin = document.getElementById('btnLogin');
            const btnCadastro = document.getElementById('btnCadastro');
            const titulo = document.getElementById('titulo');
            const subtitulo = document.getElementById('subtitulo');
            const btnSubmit = document.getElementById('btnSubmit');
            const linkAlternar = document.getElementById('linkAlternar');

            // Lista de todos os campos do cadastro (para mostrar/ocultar)
            const camposCadastro = document.querySelectorAll('.campos-cadastro');

            // Se for modo cadastro
            if (modo === 'cadastro') {
                // Marca o botão de cadastro como ativo
                btnCadastro.classList.add('ativo');
                // Desmarca o botão de login
                btnLogin.classList.remove('ativo');
                // Mostra todos os campos do cadastro
                camposCadastro.forEach(campo => {
                    // Se não for o CNPJ (que depende do tipo), mostra
                    if (campo.id !== 'campoCnpj') campo.classList.add('visivel');
                });
                // Garante a visibilidade correta do CNPJ conforme o tipo
                alternarTipoCliente();
                // Atualiza os textos
                titulo.textContent = 'Crie sua conta';
                subtitulo.textContent = 'Preencha seus dados para começar';
                btnSubmit.textContent = 'Criar conta';
                linkAlternar.innerHTML = 'Já tem conta? <a href="#" onclick="definirModo(\'login\'); return false;">Entrar</a>';
            } else {
                // Caso contrário, é modo login
                btnLogin.classList.add('ativo');
                btnCadastro.classList.remove('ativo');
                // Oculta todos os campos do cadastro
                camposCadastro.forEach(campo => campo.classList.remove('visivel'));
                // Esconde o campo CNPJ novamente
                document.getElementById('campoCnpj').style.display = 'none';
                titulo.textContent = 'Bem-vindo de volta!';
                subtitulo.textContent = 'Entre com sua conta para continuar';
                btnSubmit.textContent = 'Entrar';
                linkAlternar.innerHTML = 'Não tem conta? <a href="#" onclick="definirModo(\'cadastro\'); return false;">Criar agora</a>';
            }
        }

        // Define o plano selecionado (chamado pelo select)
        function definirPlano(valor) {
            // Sem ação extra por enquanto (o valor já é lido no envio)
            return valor;
        }

        // Aplica o plano vindo da URL (ex.: login.html?modo=cadastro&plano=pro)
        function aplicarPlanoUrl() {
            // Lê o parâmetro plano da URL
            const plano = lerParamUrl('plano');
            // Se houver um plano válido
            if (plano) {
                // Obtém o select de plano
                const select = document.getElementById('plano');
                // Verifica se o plano existe nas opções
                const opcoes = ['free', 'basic', 'pro'];
                // Se o plano for válido, define o select
                if (opcoes.indexOf(plano) !== -1) {
                    // Define o valor do select
                    select.value = plano;
                }
            }
        }

        // Alterna o campo CNPJ conforme o tipo de cliente (PF/PJ)
        function alternarTipoCliente() {
            // Obtém o valor selecionado do tipo de cliente
            const tipo = document.getElementById('tipoCliente').value;
            // Obtém o campo CNPJ
            const campoCnpj = document.getElementById('campoCnpj');
            // Se for PJ, mostra o campo CNPJ
            if (tipo === 'PJ') {
                // Exibe o campo CNPJ
                campoCnpj.style.display = 'block';
            } else {
                // Caso contrário, oculta o campo CNPJ
                campoCnpj.style.display = 'none';
            }
        }

        // Processa o envio do formulário
        async function processarForm() {
            // Pega os valores dos campos
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const nome = document.getElementById('nome').value.trim();
            const tel = document.getElementById('tel').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const nascimento = document.getElementById('nascimento').value;
            const tipoCliente = document.getElementById('tipoCliente').value;
            const cnpj = document.getElementById('cnpj').value.trim();
            const cep = document.getElementById('cep').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const numero = document.getElementById('numero').value.trim();
            const bairro = document.getElementById('bairro').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
const estado = document.getElementById('estado').value.trim();
            // Plano selecionado no cadastro
            const plano = document.getElementById('plano') ? document.getElementById('plano').value : 'free';

            // Valida o e-mail
            if (!validarEmail(email)) {
                // Mostra erro de e-mail
                mostrarToast('Informe um e-mail válido', 'erro');
                return;
            }
            // Valida a senha
            if (senha.length < 4) {
                // Mostra erro de senha
                mostrarToast('A senha deve ter pelo menos 4 caracteres', 'erro');
                return;
            }

            // Se o modo for cadastro
            if (modoAtual === 'cadastro') {
                // Valida o nome
                if (!nome) {
                    mostrarToast('Informe seu nome', 'erro');
                    return;
                }
                // Valida o CPF (se PF)
                if (tipoCliente === 'PF' && !validarCPF(cpf)) {
                    mostrarToast('Informe um CPF válido (11 dígitos)', 'erro');
                    return;
                }
                // Valida o CNPJ (se PJ)
                if (tipoCliente === 'PJ' && !cnpj) {
                    mostrarToast('Informe o CNPJ', 'erro');
                    return;
                }
                // Chama a API para cadastrar com todos os dados
                const resposta = await apiCadastrarCliente({
                    nome: nome,
                    email: email,
                    tel: tel,
                    cpf: cpf,
                    nascimento: nascimento,
                    tipoCliente: tipoCliente,
                    cnpj: cnpj,
                    cep: cep,
                    endereco: endereco,
                    numero: numero,
                    bairro: bairro,
                    cidade: cidade,
estado: estado,
                    senha: senha,
                    plano: plano
                });
                // Se cadastrou com sucesso
                if (resposta.sucesso) {
                    mostrarToast('Conta criada! Fazendo login...', 'sucesso');
                    // Faz login automático após o cadastro
                    const login = await apiLogin(email, senha);
                    // Se o login automático funcionou
                    if (login.sucesso) {
                        // Salva a sessão
                        salvarSessao(login.dados.token, login.dados.usuario);
                        // Redireciona para o dashboard
                        setTimeout(() => irPara('dashboard.html'), 800);
                    } else {
                        // Se falhou, alterna para o modo login
                        definirModo('login');
                    }
                } else {
                    mostrarToast(resposta.mensagem, 'erro');
                }
                return;
            }

            // Modo login: chama a API de login
            const resposta = await apiLogin(email, senha);
            // Se logou com sucesso
            if (resposta.sucesso) {
                // Salva a sessão
                salvarSessao(resposta.dados.token, resposta.dados.usuario);
                mostrarToast('Login realizado!', 'sucesso');
                // Redireciona para o dashboard
                setTimeout(() => irPara('dashboard.html'), 800);
            } else {
                mostrarToast(resposta.mensagem, 'erro');
            }
        }

        // Ao carregar a página, verifica o parâmetro modo da URL
        window.addEventListener('load', () => {
            // Lê o parâmetro modo da URL
            const modo = lerParamUrl('modo');
// Se for cadastro, define o modo cadastro
            if (modo === 'cadastro') {
                definirModo('cadastro');
            }
            // Aplica o plano vindo da URL (ex.: &plano=pro)
            aplicarPlanoUrl();
        });
    </script>
</body>
</html>
