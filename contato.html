    <!-- SCRIPT DE INTEGRAÇÃO INTEGRAL COM O GOOGLE APPS SCRIPT -->
    <script>
        // Substitua esta string pela nova URL exata do Web App gerada no seu painel do Apps Script

        const form = document.getElementById("form-contato");

        form.addEventListener("submit", function(event) {
            event.preventDefault(); 

            // Desativa o botão preventivamente para evitar múltiplos cliques e envios fantasmas
            const btnEnviar = form.querySelector("button");
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Enviando...";

            // Sincronizado estritamente com as chaves e propriedades exigidas no arquivo codigo.gs
            const dadosFormulario = {
                acao: "cadastroLead",
                id: Date.now().toString(), 
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                assunto: document.getElementById("assunto").value,
                mensagem: document.getElementById("mensagem").value
            };

            // Envio via API_CLIENT (modo CORS padrão). 
            // Importante: o Google Apps Script precisa ter CORS configurado para permitir requisições do domínio.
            API_CLIENT.post(CONFIG.APIS.CONTATO, dadosFormulario)
            .then(async (response) => {
                let resultado;
                try {
                    resultado = await response.json();
                } catch (e) {
                    console.warn('Resposta não é JSON:', e);
                    resultado = { status: 'erro', mensagem: 'Resposta inválida do servidor.' };
                }
                if (resultado && (resultado.status === 'sucesso' || resultado.success === true)) {
                    alert("Mensagem enviada com sucesso!");
                    form.reset();
                } else {
                    alert(resultado.mensagem || resultado.error || "Erro ao enviar mensagem. Tente novamente.");
                }
            })
            .catch(erro => {
                console.error("Erro na requisição:", erro);
                alert("Erro de conexão ao enviar mensagem. Verifique sua internet e tente novamente.");
            })
            .finally(() => {
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Enviar mensagem";
            });
        });
    </script>
